# Apache vhost for Demo NovuStream on port 9000
# Use: http://YOUR_SERVER:9000
# Only this site should use port 9000 on this server (subic_novustream_9000 was removed to avoid conflict).
#
# 0. Fix storage permissions (so Laravel can write logs):
#    sudo bash apache/fix-storage-permissions.sh
# 1. Add to Apache ports (as root):
#    echo 'Listen 9000' >> /etc/apache2/ports.conf
# 2. Enable proxy and PHP-FPM modules:
#    sudo a2enmod proxy proxy_fcgi rewrite
# 3. Copy this file and enable:
#    sudo cp apache/demo_novustream_9000.conf /etc/apache2/sites-available/
#    sudo a2ensite demo_novustream_9000.conf
#    sudo apachectl configtest && sudo systemctl reload apache2
# 4. If needed, open firewall:
#    sudo ufw allow 9000/tcp && sudo ufw reload
#
# If you get HTTP 503 Service Unavailable:
#   Start PHP-FPM: sudo systemctl start php8.3-fpm && sudo systemctl enable php8.3-fpm
# If you get HTTP 500:
#   Check Apache error log: sudo tail -f /var/log/apache2/demo_novustream_9000_error.log
#   Check Laravel log: tail -f storage/logs/laravel.log

<VirtualHost *:9000>
    ServerName 38.226.41.4
    DocumentRoot /var/www/html/demo_novustream/public

    <Directory /var/www/html/demo_novustream/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php

        # Use generic php-fpm.sock (symlink); or use /run/php/php8.3-fpm.sock if preferred
        <FilesMatch \.php$>
            SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/demo_novustream_9000_error.log
    CustomLog ${APACHE_LOG_DIR}/demo_novustream_9000_access.log combined
    LogLevel warn
</VirtualHost>
