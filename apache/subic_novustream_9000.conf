# Apache vhost for Subic NovuStream on port 9000
# Use: http://38.226.41.4:9000
#
# 0. Fix storage permissions (so Laravel can write logs):
#    sudo bash apache/fix-storage-permissions.sh
# 1. Add to Apache ports (as root):
#    echo 'Listen 9000' >> /etc/apache2/ports.conf
# 2. Copy this file and enable:
#    sudo cp apache/subic_novustream_9000.conf /etc/apache2/sites-available/
#    sudo a2ensite subic_novustream_9000.conf
#    sudo apachectl configtest && sudo systemctl reload apache2
# 3. If needed, open firewall:
#    sudo ufw allow 9000/tcp && sudo ufw reload

<VirtualHost *:9000>
    ServerName 38.226.41.4
    DocumentRoot /var/www/html/subic_novustream/public

    <Directory /var/www/html/subic_novustream/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/subic_novustream_9000_error.log
    CustomLog ${APACHE_LOG_DIR}/subic_novustream_9000_access.log combined
</VirtualHost>
